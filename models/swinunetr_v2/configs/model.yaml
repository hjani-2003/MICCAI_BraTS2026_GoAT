model:
  name: SwinUNETR

  in_channels: 4
  out_channels: 3

  depths: (2, 2, 2, 2)
  num_heads: (3, 6, 12, 24)
  feature_size: 48
  norm_name: "instance"
  drop_rate: 0.0
  attn_drop_rate: 0.0
  dropout_path_rate: 0.1
  normalize: True
  use_checkpoint: False
  spatial_dims: 3
  downsample: "merging"
  use_v2: True
